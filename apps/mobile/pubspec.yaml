name: antisismo
description: "AntiSismo — Prevención · Alerta · Vida. Alerta temprana multi-amenaza."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

# Versiones EXACTAS (EXECUTION_PROMPT §1 regla de versiones). Actualizar solo con pubspec.lock revisado.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: 3.0.7
  cryptography: 2.9.0
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  intl: 0.20.3
  timezone: 0.11.1
  flutter_secure_storage: 11.2.0
  flutter_tts: 4.2.5
  geolocator: 14.1.1
  shared_preferences: 2.5.5
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo-fullcolor.png
    - assets/brand/symbol.png
    - assets/licenses/
  # Fuentes empaquetadas (nunca Google Fonts en runtime: idéntica offline). Subset latino, licencia OFL.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#0A2540"
  adaptive_icon_foreground: assets/brand/app_icon_fg.png
  adaptive_icon_monochrome: assets/brand/app_icon_mono.png

flutter_native_splash:
  color: "#0A2540"
  image: assets/brand/splash.png
  android_12:
    color: "#0A2540"
    image: assets/brand/app_icon_fg.png
    icon_background_color: "#0A2540"
  fullscreen: false
