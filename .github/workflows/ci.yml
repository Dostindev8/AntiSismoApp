name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false # sin dependencias externas aún (no hay go.sum)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: cd apps/mobile && flutter pub get
      - name: Gate (make verify)
        run: make verify
      - name: Go race detector (camino crítico)
        run: |
          (cd packages/proto/go && go test -race -count=1 ./...)
          (cd services/ingestion && go test -race -count=1 ./...)
      - name: Fuzz smoke
        run: |
          cd services/ingestion
          go test -run='^$' -fuzz=FuzzSanitizePlace -fuzztime=20s ./normalize
          go test -run='^$' -fuzz=FuzzDecodeEvent -fuzztime=20s ./normalize

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd packages/proto/go && govulncheck ./...)
          (cd services/ingestion && govulncheck ./...)
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (prod)
        run: pnpm audit --prod --audit-level high
