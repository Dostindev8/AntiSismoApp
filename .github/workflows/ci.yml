name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (versión desde packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # sin dependencias externas aún (no hay go.sum)
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: cd apps/mobile && flutter pub get
      - name: Gate (make verify)
        run: make verify
      - name: Go race detector (camino crítico)
        run: |
          (cd packages/proto/go && go test -race -count=1 ./...)
          (cd services/ingestion && go test -race -count=1 ./...)
          (cd services/delivery && go test -race -count=1 ./...)
      - name: Fuzz smoke
        run: |
          cd services/ingestion
          go test -run='^$' -fuzz=FuzzSanitizePlace -fuzztime=20s ./normalize
          go test -run='^$' -fuzz=FuzzDecodeEvent -fuzztime=20s ./normalize
