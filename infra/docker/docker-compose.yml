# Entorno local. Redis = camino crítico (con fallback a memoria si cae); Postgres+PostGIS = servicios de valor.
# Solo escucha en 127.0.0.1. Credenciales de DESARROLLO únicamente.
name: antisismo
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    volumes: [redis-data:/data]

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: antisismo
      POSTGRES_USER: antisismo
      POSTGRES_PASSWORD: antisismo
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antisismo -d antisismo"]
      interval: 5s
      retries: 10
    volumes: [pg-data:/var/lib/postgresql/data]

volumes:
  redis-data:
  pg-data:
